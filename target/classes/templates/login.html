<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart HRMS | Secure Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/hrms.css}">
    <script defer th:src="@{/js/hrms.js}"></script>
</head>
<body class="login-page">
<div class="login-shell">
    <div class="login-brand">
        <div class="brand-mark">SH</div>
        <div>
            <div class="brand-title">Smart HRMS</div>
            <div class="brand-subtitle">Employee Management System</div>
        </div>
    </div>

    <div class="login-card">
        <div class="login-heading">
            <span class="eyebrow">EMPLOYEE PORTAL</span>
            <h1>Welcome back</h1>
            <p>Sign in to continue to the employee management system.</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger py-2 small">Invalid username or password.</div>
        <div th:if="${param.logout}" class="alert alert-success py-2 small">You have been signed out safely.</div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input class="form-control form-control-lg" type="text" name="username" autocomplete="username" placeholder="Enter username" required autofocus>
            </div>
            <div class="mb-2">
                <label class="form-label">Password</label>
                <div class="password-wrap">
                    <input id="password" class="form-control form-control-lg" type="password" name="password" autocomplete="current-password" placeholder="Enter password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword()">Show</button>
                </div>
            </div>
            <div class="login-meta">
                <span>Authorized users only</span>
                <span>Smart HRMS</span>
            </div>
            <button class="btn btn-primary btn-lg w-100 login-btn" type="submit">Sign in</button>
        </form>
    </div>

    <div class="login-footer">Smart HRMS · Employee Management System</div>
</div>
<script>
function togglePassword(){const p=document.getElementById('password');const b=document.querySelector('.password-toggle');if(p.type==='password'){p.type='text';b.textContent='Hide';}else{p.type='password';b.textContent='Show';}}
</script>
</body>
</html>
