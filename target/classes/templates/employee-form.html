<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Edit Employee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>
<body>

<div class="container mt-5">

    <h2>Edit Employee</h2>

    <form th:action="@{/employees/update}"
          th:object="${employee}"
          method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <input type="hidden"
               th:field="*{id}">

        <div class="mb-3">
            <label>First Name</label>
            <input class="form-control"
                   th:field="*{firstName}">
        </div>

        <div class="mb-3">
            <label>Last Name</label>
            <input class="form-control"
                   th:field="*{lastName}">
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input class="form-control"
                   th:field="*{email}">
        </div>

        <div class="mb-3">
            <label>Phone</label>
            <input class="form-control"
                   th:field="*{phone}">
        </div>

        <div class="mb-3">
            <label>Designation</label>
            <input class="form-control"
                   th:field="*{designation}">
        </div>

        <div class="mb-3">
            <label>Salary</label>
            <input class="form-control"
                   th:field="*{salary}">
        </div>

        <button class="btn btn-success">
            Update Employee
        </button>

        <a href="/employees"
           class="btn btn-secondary">

            Back

        </a>

    </form>

</div>

</body>
</html>
