<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Attendance Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="container mt-4"
     style="margin-left:270px;">

    <h2>Attendance Management</h2>

    <hr>

    <h4>Check In Employees</h4>

    <table class="table table-bordered">

        <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="emp : ${employees}">

            <td th:text="${emp.id}"></td>

            <td th:text="${emp.firstName + ' ' + emp.lastName}"></td>

            <td>

                <a th:href="@{/attendance/checkin/{id}(id=${emp.id})}"
                   class="btn btn-success btn-sm">

                    Check In

                </a>

            </td>

        </tr>

        </tbody>

    </table>

    <hr>

    <h4>Attendance Records</h4>

    <table class="table table-striped table-bordered">

        <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Employee</th>
            <th>Date</th>
            <th>Check In</th>
            <th>Check Out</th>
            <th>Status</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="att : ${attendanceList}">

            <td th:text="${att.id}"></td>

            <td th:text="${att.employee.firstName + ' ' + att.employee.lastName}"></td>

            <td th:text="${att.attendanceDate}"></td>

            <td th:text="${att.checkInTime}"></td>

            <td th:text="${att.checkOutTime}"></td>

            <td th:text="${att.status}"></td>

            <td>

                <a th:href="@{/attendance/checkout/{id}(id=${att.id})}"
                   class="btn btn-warning btn-sm">

                    Check Out

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
