<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="sidebar">
    <link rel="stylesheet" th:href="@{/css/hrms.css}">
    <script defer th:src="@{/js/hrms.js}"></script>

    <style>
        .hrms-sidebar {
            width: 248px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 1030;
            padding: 22px 16px;
            background: #111827;
            border-right: 1px solid #1f2937;
            box-shadow: 8px 0 24px rgba(15, 23, 42, 0.06);
            display: flex;
            flex-direction: column;
        }

        .hrms-brand {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 4px 8px 22px;
        }

        .hrms-brand-mark {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            background: #1f5aa6;
            color: #fff;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: -0.5px;
            box-shadow: none;
        }

        .hrms-brand-name {
            color: #f8fafc;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .hrms-brand-subtitle {
            color: #64748b;
            font-size: 10px;
            margin-top: 1px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .hrms-nav-label {
            color: #64748b;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 8px 11px 10px;
        }

        .hrms-nav {
            gap: 4px;
        }

        .hrms-nav .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #94a3b8 !important;
            border-radius: 10px;
            padding: 11px 12px;
            font-size: 13.5px;
            font-weight: 500;
            transition: background .18s ease, color .18s ease, transform .18s ease;
        }

        .hrms-nav .nav-link:hover {
            background: #1f2937;
            color: #f8fafc !important;
            transform: translateX(2px);
        }

        .hrms-nav .nav-link.active {
            background: #1d4ed8;
            color: #fff !important;
        }

        .hrms-nav-icon {
            width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 18px;
        }

        .hrms-nav-icon svg {
            width: 17px;
            height: 17px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .hrms-sidebar-footer {
            margin-top: auto;
            padding: 13px 11px 2px;
            border-top: 1px solid #1f2937;
        }

        .hrms-sidebar-footer .version {
            color: #64748b;
            font-size: 11px;
        }

        @media (max-width: 900px) {
            .hrms-sidebar {
                width: 210px;
            }
        }
    </style>

    <aside class="hrms-sidebar">

        <div class="hrms-brand">
            <div class="hrms-brand-mark">SH</div>
            <div>
                <div class="hrms-brand-name">Smart HRMS</div>
                <div class="hrms-brand-subtitle">Employee Portal</div>
            </div>
        </div>

        <div class="hrms-nav-label">Workspace</div>

        <ul class="nav flex-column hrms-nav">

            <li class="nav-item">
                <a href="/" class="nav-link">
                    <span class="hrms-nav-icon">
                        <svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"></path><path d="M5 9v11h14V9"></path><path d="M9 20v-6h6v6"></path></svg>
                    </span>
                    Dashboard
                </a>
            </li>

            <li class="nav-item">
                <a href="/employees" class="nav-link">
                    <span class="hrms-nav-icon">
                        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    </span>
                    Employees
                </a>
            </li>

            <li class="nav-item">
                <a href="/departments" class="nav-link">
                    <span class="hrms-nav-icon">
                        <svg viewBox="0 0 24 24"><path d="M3 21h18"></path><path d="M5 21V5l7-3 7 3v16"></path><path d="M9 8h1"></path><path d="M14 8h1"></path><path d="M9 12h1"></path><path d="M14 12h1"></path><path d="M10 21v-5h4v5"></path></svg>
                    </span>
                    Departments
                </a>
            </li>

            <li class="nav-item">
                <a href="/attendance/summary" class="nav-link">
                    <span class="hrms-nav-icon"><svg viewBox="0 0 24 24"><path d="M4 19V5"></path><path d="M4 19h17"></path><path d="M7 15l4-4 3 2 5-6"></path></svg></span>
                    Attendance Summary
                </a>
            </li>

            <li class="nav-item">
                <a href="/attendance" class="nav-link">
                    <span class="hrms-nav-icon">
                        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path><path d="m8 15 2 2 5-5"></path></svg>
                    </span>
                    Attendance
                </a>
            </li>

            <li class="nav-item">
                <a href="/leaves" class="nav-link">
                    <span class="hrms-nav-icon">
                        <svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"></path><path d="M15 3v4h4"></path><path d="M9 13h6M9 17h4"></path></svg>
                    </span>
                    Leave Management
                </a>
            </li>

            <li class="nav-item">
                <a href="/leaves/calendar" class="nav-link">
                    <span class="hrms-nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path><path d="M8 14h3M8 18h5"></path></svg></span>
                    Leave Calendar
                </a>
            </li>

            <li class="nav-item">
                <a href="/reports" class="nav-link">
                    <span class="hrms-nav-icon">
                        <svg viewBox="0 0 24 24"><path d="M4 19V5"></path><path d="M4 19h17"></path><path d="m7 15 4-4 3 2 5-6"></path></svg>
                    </span>
                    Reports
                </a>
            <li class="nav-item">
                <a href="/settings" class="nav-link">
                    <span class="hrms-nav-icon">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.7 1.7-.06-.06A1.7 1.7 0 0 0 16.16 18a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.38 1.08V20h-2.4v-.32A1.7 1.7 0 0 0 11.34 18a1.7 1.7 0 0 0-1-.6 1.7 1.7 0 0 0-1.88.34l-.06.06-1.7-1.7.06-.06A1.7 1.7 0 0 0 7.1 14.16a1.7 1.7 0 0 0-.6-1A1.7 1.7 0 0 0 5.42 12H5v-2.4h.42A1.7 1.7 0 0 0 7.1 8.52a1.7 1.7 0 0 0-.34-1.88L6.7 6.58l1.7-1.7.06.06A1.7 1.7 0 0 0 10.34 5a1.7 1.7 0 0 0 1-.6A1.7 1.7 0 0 0 11.72 3.32V3h2.4v.32A1.7 1.7 0 0 0 15.16 5a1.7 1.7 0 0 0 1 .6 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.7 1.7-.06.06A1.7 1.7 0 0 0 19.4 8.84a1.7 1.7 0 0 0 .6 1c.3.24.68.36 1.08.36H21v2.4h-.32A1.7 1.7 0 0 0 19.4 15z"></path></svg>
                    </span>
                    Settings
                </a>
            </li>

        </ul>

        <div class="hrms-sidebar-footer">
            <div class="theme-label">Appearance</div>
            <select class="theme-select" data-theme-select aria-label="Theme preference">
                <option value="system">System</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>
            <div class="d-flex align-items-center justify-content-between mt-3">
                <div class="version">Smart HRMS · v2.0</div>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-sm btn-outline-secondary" style="font-size:10px;padding:4px 7px;">Logout</button>
                </form>
            </div>
        </div>

    </aside>

</div>

</body>
</html>
