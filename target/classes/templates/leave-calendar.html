<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Leave Calendar | Smart HRMS</title><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/hrms.css}"><style>.main-content{margin-left:248px;padding:28px}.panel{background:var(--surface,#fff);border:1px solid #e5e7eb;border-radius:10px;padding:20px}.leave-row{border-left:4px solid #1f5aa6;padding:12px 15px;margin-bottom:10px;background:#f8fafc;border-radius:6px}</style></head><body><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="d-flex justify-content-between align-items-center mb-4"><div><div class="text-secondary small">Leave Management</div><h2 class="mb-1">Leave Calendar</h2><div class="text-secondary">Upcoming and recent requests</div></div><a href="/leaves" class="btn btn-outline-secondary">Leave Requests</a></div><div class="panel"><div th:if="${#lists.isEmpty(leaves)}" class="text-secondary">No leave requests have been recorded.</div><div th:each="l:${leaves}" class="leave-row"><div class="d-flex justify-content-between align-items-start"><div><strong th:text="${l.employee.firstName+' '+l.employee.lastName}"></strong><div class="text-secondary small mt-1" th:text="${l.leaveType+' · '+l.startDate+' to '+l.endDate}"></div><div class="small mt-1" th:text="${l.reason}"></div></div><span class="badge bg-light text-dark border" th:text="${l.status}"></span></div></div></div></main></body></html>
