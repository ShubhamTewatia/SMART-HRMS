<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Employee Profile | Smart HRMS</title><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/hrms.css}"><style>.main-content{margin-left:248px;padding:28px}.panel{background:var(--surface,#fff);border:1px solid #e5e7eb;border-radius:10px;padding:22px}.label{font-size:12px;color:#64748b}.value{font-size:15px;font-weight:600}.avatar{width:62px;height:62px;border-radius:50%;background:#e8f0fb;color:#1f5aa6;display:grid;place-items:center;font-size:22px;font-weight:700}.metric{border:1px solid #e5e7eb;border-radius:9px;padding:15px}</style></head><body><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="d-flex justify-content-between align-items-center mb-4"><div><div class="text-secondary small">Employees / Profile</div><h2 class="mb-1">Employee Profile</h2><div class="text-secondary" th:text="${today}"></div></div><a href="/employees" class="btn btn-outline-secondary">Back to Employees</a></div><div class="panel mb-3"><div class="d-flex gap-3 align-items-center"><div class="avatar" th:text="${#strings.substring(employee.firstName,0,1)} + ${#strings.substring(employee.lastName,0,1)}">ST</div><div><h4 class="mb-1" th:text="${employee.firstName+' '+employee.lastName}"></h4><div class="text-secondary" th:text="${employee.designation}"></div></div></div><hr><div class="row g-3"><div class="col-md-4"><div class="label">Email</div><div class="value" th:text="${employee.email}"></div></div><div class="col-md-4"><div class="label">Phone</div><div class="value" th:text="${employee.phone}"></div></div><div class="col-md-4"><div class="label">Department</div><div class="value" th:text="${employee.department != null ? employee.department.departmentName : 'Not assigned'}"></div></div></div></div><div class="row g-3 mb-3"><div class="col-md-6"><div class="metric"><div class="label">Recorded Present Days</div><div class="fs-4 fw-bold" th:text="${presentCount}"></div></div></div><div class="col-md-6"><div class="metric"><div class="label">Recent Approved Leaves</div><div class="fs-4 fw-bold" th:text="${approvedLeaves}"></div></div></div></div><div class="row g-3"><div class="col-lg-7"><div class="panel"><h5>Recent Attendance</h5><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Date</th><th>Check In</th><th>Check Out</th><th>Status</th></tr></thead><tbody><tr th:each="a:${attendance}"><td th:text="${a.attendanceDate}"></td><td th:text="${a.checkInTime}"></td><td th:text="${a.checkOutTime != null ? a.checkOutTime : '-'}"></td><td th:text="${a.status}"></td></tr></tbody></table></div></div></div><div class="col-lg-5"><div class="panel"><h5>Recent Leave Requests</h5><div th:each="l:${leaves}" class="border-bottom py-2"><div class="d-flex justify-content-between"><strong th:text="${l.leaveType}"></strong><span th:text="${l.status}"></span></div><small class="text-secondary" th:text="${l.startDate+' to '+l.endDate}"></small></div></div></div></div></main></body></html>
