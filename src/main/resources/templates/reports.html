<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Reports</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="container mt-4"
     style="margin-left:270px;">

    <h2>Reports & Analytics</h2>

    <hr>

    <div class="row g-4">

        <div class="col-md-3">
            <div class="card p-4 text-center">
                <h5>Total Employees</h5>
                <h2 th:text="${employees}"></h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-4 text-center">
                <h5>Total Departments</h5>
                <h2 th:text="${departments}"></h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-4 text-center">
                <h5>Attendance Records</h5>
                <h2 th:text="${attendance}"></h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-4 text-center">
                <h5>Leave Requests</h5>
                <h2 th:text="${leaves}"></h2>
            </div>
        </div>

    </div>

    <div class="mt-5">

        <div class="card p-4">

            <h4>Management Summary</h4>

            <ul>
                <li>Total Employees Registered</li>
                <li>Total Departments Available</li>
                <li>Total Attendance Records</li>
                <li>Total Leave Requests</li>
            </ul>

        </div>

    </div>

</div>

</body>
</html>
