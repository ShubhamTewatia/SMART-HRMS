<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Employee Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="container-fluid mt-4"
     style="margin-left:270px; width:calc(100% - 290px);">

    <!-- Page Header -->

    <div class="card p-4 mb-4 shadow-sm">

        <h2 class="mb-2">
            Employee Management
        </h2>

        <p class="text-muted mb-0">
            Manage employee information, departments,
            salaries and records from one place.
        </p>

    </div>

    <!-- Search Section -->

    <div class="card p-3 mb-4 shadow-sm">

        <form th:action="@{/employees/search}"
              method="get">

            <div class="row">

                <div class="col-md-4">

                    <input type="text"
                           name="keyword"
                           class="form-control"
                           placeholder="Search Employee By First Name">

                </div>

                <div class="col-md-2">

                    <button type="submit"
                            class="btn btn-success w-100">

                        Search

                    </button>

                </div>

                <div class="col-md-2">

                    <a href="/employees"
                       class="btn btn-secondary w-100">

                        Reset

                    </a>

                </div>

            </div>

        </form>

    </div>

    <!-- Employee Count -->

    <div class="alert alert-primary">

        Total Employees :
        <strong th:text="${employees.size()}"></strong>

    </div>

    <!-- Add Employee Form -->

    <div class="card p-4 mb-4 shadow-sm">

        <h4 class="mb-4">
            Add New Employee
        </h4>

        <form th:action="@{/employees/save}"
              th:object="${employee}"
              method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="row">

                <div class="col-md-4">
                    <input class="form-control"
                           type="text"
                           th:field="*{firstName}"
                           placeholder="First Name">
                </div>

                <div class="col-md-4">
                    <input class="form-control"
                           type="text"
                           th:field="*{lastName}"
                           placeholder="Last Name">
                </div>

                <div class="col-md-4">
                    <input class="form-control"
                           type="email"
                           th:field="*{email}"
                           placeholder="Email">
                </div>

            </div>

            <br>

            <div class="row">

                <div class="col-md-3">
                    <input class="form-control"
                           type="text"
                           th:field="*{phone}"
                           placeholder="Phone">
                </div>

                <div class="col-md-3">
                    <input class="form-control"
                           type="text"
                           th:field="*{designation}"
                           placeholder="Designation">
                </div>

                <div class="col-md-3">
                    <input class="form-control"
                           type="number"
                           th:field="*{salary}"
                           placeholder="Salary">
                </div>

                <div class="col-md-3">

                    <select class="form-select"
                            th:field="*{department}">

                        <option value="">
                            Select Department
                        </option>

                        <option
                                th:each="dept : ${departments}"
                                th:value="${dept.id}"
                                th:text="${dept.departmentName}">
                        </option>

                    </select>

                </div>

            </div>

            <br>

            <button class="btn btn-primary"
                    type="submit">

                Add Employee

            </button>

        </form>

    </div>

    <!-- Employee Table -->

    <!-- Employee Table -->

    <div class="card p-3 shadow-sm">

        <div class="d-flex justify-content-between align-items-center mb-3">

            <h4 class="mb-0">
                Employee Records
            </h4>

            <a href="/employees/export"
               class="btn btn-success">

                Export Excel

            </a>

        </div>

        <table class="table table-bordered table-striped">

            <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Designation</th>
                <th>Salary</th>
                <th>Department</th>
                <th width="150">Action</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="emp : ${employees}">

                <td th:text="${emp.id}"></td>

                <td th:text="${emp.firstName + ' ' + emp.lastName}"></td>

                <td th:text="${emp.email}"></td>

                <td th:text="${emp.designation}"></td>

                <td th:text="${emp.salary}"></td>

                <td th:text="${emp.department != null ?
                        emp.department.departmentName : 'N/A'}">
                </td>

                <td>

                    <a th:href="@{/employees/edit/{id}(id=${emp.id})}"
                       class="btn btn-warning btn-sm">

                        Edit

                    </a>

                    <a th:href="@{/employees/delete/{id}(id=${emp.id})}"
                       class="btn btn-danger btn-sm">

                        Delete

                    </a>

                    <a th:href="@{/employees/{id}/profile(id=${emp.id})}"
                       class="btn btn-outline-primary btn-sm">

                        Profile

                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
