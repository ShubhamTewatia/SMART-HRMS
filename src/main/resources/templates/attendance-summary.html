<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Attendance Summary | Smart HRMS</title><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/hrms.css}"><style>.main-content{margin-left:248px;padding:28px}.panel{background:var(--surface,#fff);border:1px solid #e5e7eb;border-radius:10px;padding:20px}.metric{border:1px solid #e5e7eb;border-radius:9px;padding:16px}</style></head><body><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="d-flex justify-content-between align-items-center mb-4"><div><div class="text-secondary small">Attendance</div><h2 class="mb-1">Attendance Summary</h2><div class="text-secondary" th:text="${monthName}"></div></div><a href="/attendance" class="btn btn-outline-secondary">Attendance Records</a></div><div class="row g-3 mb-4"><div class="col-md-4"><div class="metric"><div class="text-secondary small">Present Today</div><div class="fs-3 fw-bold" th:text="${todayPresent}"></div></div></div><div class="col-md-4"><div class="metric"><div class="text-secondary small">Present This Month</div><div class="fs-3 fw-bold" th:text="${monthPresent}"></div></div></div><div class="col-md-4"><div class="metric"><div class="text-secondary small">Completed Check-outs</div><div class="fs-3 fw-bold" th:text="${monthComplete}"></div></div></div></div><div class="panel"><h5 class="mb-3">Recent Attendance Activity</h5><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Employee</th><th>Date</th><th>Check In</th><th>Check Out</th><th>Status</th></tr></thead><tbody><tr th:each="a:${records}"><td th:text="${a.employee.firstName+' '+a.employee.lastName}"></td><td th:text="${a.attendanceDate}"></td><td th:text="${a.checkInTime}"></td><td th:text="${a.checkOutTime != null ? a.checkOutTime : '-'}"></td><td><span class="badge bg-success-subtle text-success" th:text="${a.status}"></span></td></tr></tbody></table></div></div></main></body></html>
