<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Leave Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="container mt-4"
     style="margin-left:270px;">
    
    <h2>Leave Management</h2>

    <hr>

    <h4>Apply Leave</h4>

    <form th:object="${leaveRequest}"
          method="post"
          id="leaveForm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="row">

            <div class="col-md-3">

                <select id="employeeSelect"
                        class="form-control">

                    <option value="">
                        Select Employee
                    </option>

                    <option
                            th:each="emp : ${employees}"
                            th:value="${emp.id}"
                            th:text="${emp.firstName + ' ' + emp.lastName}">
                    </option>

                </select>

            </div>

            <div class="col-md-2">
                <input class="form-control"
                       th:field="*{leaveType}"
                       placeholder="Leave Type">
            </div>

            <div class="col-md-2">
                <input type="date"
                       class="form-control"
                       th:field="*{startDate}">
            </div>

            <div class="col-md-2">
                <input type="date"
                       class="form-control"
                       th:field="*{endDate}">
            </div>

            <div class="col-md-3">
                <input class="form-control"
                       th:field="*{reason}"
                       placeholder="Reason">
            </div>

        </div>

        <br>

        <button type="button"
                class="btn btn-primary"
                onclick="submitLeave()">

            Apply Leave

        </button>

    </form>

    <hr>

    <h4>Leave Requests</h4>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Employee</th>
            <th>Type</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Status</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="leave : ${leaves}">

            <td th:text="${leave.id}"></td>

            <td th:text="${leave.employee.firstName + ' ' + leave.employee.lastName}"></td>

            <td th:text="${leave.leaveType}"></td>

            <td th:text="${leave.startDate}"></td>

            <td th:text="${leave.endDate}"></td>

            <td th:text="${leave.status}"></td>

            <td>

                <a th:href="@{/leaves/approve/{id}(id=${leave.id})}"
                   class="btn btn-success btn-sm">

                    Approve

                </a>

                <a th:href="@{/leaves/reject/{id}(id=${leave.id})}"
                   class="btn btn-danger btn-sm">

                    Reject

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

<script>
    function submitLeave() {
        let employeeId =
            document.getElementById("employeeSelect").value;

        if(!employeeId){
            alert("Select Employee");
            return;
        }

        document.getElementById("leaveForm").action =
            "/leaves/apply/" + employeeId;

        document.getElementById("leaveForm").submit();
    }
</script>

</body>
</html>
