<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Departments</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="container mt-4"
     style="margin-left:270px;">

    <h2>Department Management</h2>

    <hr>

    <form th:action="@{/departments/save}"
          th:object="${department}"
          method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="row">

            <div class="col-md-5">
                <input
                        class="form-control"
                        th:field="*{departmentName}"
                        placeholder="Department Name">
            </div>

            <div class="col-md-5">
                <input
                        class="form-control"
                        th:field="*{location}"
                        placeholder="Location">
            </div>

            <div class="col-md-2">
                <button
                        class="btn btn-primary w-100">

                    Add

                </button>
            </div>

        </div>

    </form>

    <hr>

    <table class="table table-bordered">

        <thead>

        <tr>
            <th>ID</th>
            <th>Department</th>
            <th>Location</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="dept : ${departments}">

            <td th:text="${dept.id}"></td>

            <td th:text="${dept.departmentName}"></td>

            <td th:text="${dept.location}"></td>

            <td>

                <a
                        th:href="@{/departments/delete/{id}(id=${dept.id})}"
                        class="btn btn-danger btn-sm">

                    Delete

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
